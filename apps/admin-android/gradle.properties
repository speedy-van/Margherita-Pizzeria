# Project-wide Gradle settings for the Margherita Admin Android app.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Default base URL for debug builds. Use 10.0.2.2 to reach the host machine
# from a stock Android emulator running the Next.js dev server on :3000.
# Override per-developer via apps/admin-android/local.properties:
#   margherita.baseUrl=http://192.168.1.50:3000/
margherita.baseUrl.debug=http://10.0.2.2:3000/
# Use the canonical www host directly. The apex margheritapizza.uk issues a
# 308 redirect to www.margheritapizza.uk, and OkHttp strips the Authorization
# header on cross-host redirects — which would silently 401 every admin call.
margherita.baseUrl.release=https://www.margheritapizza.uk/
