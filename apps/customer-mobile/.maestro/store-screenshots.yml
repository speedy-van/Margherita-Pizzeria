appId: uk.margheritapizzeria.customer
name: Capture the actual customer app without placing orders
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'A little slice[\s\S]*'
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 01-home
- tapOn:
    text: "^Menu$"
- extendedWaitUntil:
    visible: "What are you craving\\?"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "The whole menu"
    direction: DOWN
    timeout: 30000
    centerElement: false
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-menu
- tapOn:
    text: "Bag, 0 items"
- extendedWaitUntil:
    visible: "Your bag is waiting"
    timeout: 20000
- takeScreenshot: 03-bag
- tapOn:
    text: "^Book$"
- extendedWaitUntil:
    visible: 'Good pizza[\s\S]*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-book-a-table
- tapOn:
    text: "^Track$"
- extendedWaitUntil:
    visible: "Follow your order\\."
    timeout: 20000
- takeScreenshot: 05-order-tracking
